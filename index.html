<style>
:root{font-family:system-ui,"Noto Sans KR",sans-serif;color:#192640;background:#f4f7ff}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#243c91,#596bda);color:white;padding:36px 18px;text-align:center}header h1{margin:0;font-size:24px}header p{margin:8px 0 0}.wrap{max-width:850px;margin:24px auto;padding:0 15px}.panel,.question{background:white;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 5px 18px #20306012}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.question h3{margin:0 0 15px;font-size:15px;color:#64728b}.hanzi{font-size:31px;font-weight:750;border:0;background:#eef2ff;color:#233b93;padding:12px 20px;border-radius:12px;cursor:pointer;max-width:100%;overflow-wrap:anywhere}.hanzi:focus-visible,button:focus-visible{outline:3px solid #f7ae38}.hint{font-size:12px;color:#73809b;margin:7px 0 17px}.options{display:grid;grid-template-columns:1fr 1fr;gap:9px}.option{border:1px solid #dce2ee;background:#fff;border-radius:10px;padding:13px;text-align:left;cursor:pointer;font-size:14px;line-height:1.5;color:#25324a}.option.selected{border:2px solid #455dcc;background:#eef2ff}.option.correct{border:2px solid #25976c;background:#e8f9f0}.option.wrong{border:2px solid #dc5661;background:#fff0f0}.answer{background:#fff5e9;border-left:4px solid #e8a33e;padding:12px;margin-top:13px;border-radius:6px;line-height:1.8}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 35px}button.action{border:0;border-radius:10px;background:#3049b1;color:white;padding:13px 18px;font-weight:700;cursor:pointer}.action.secondary{background:#e5eaf8;color:#263b85}.score{font-size:21px;font-weight:800;color:#243d91}.muted{color:#6b7891}.tag{background:#e9edff;border-radius:30px;padding:6px 12px;font-size:13px}.hidden{display:none}@media(max-width:550px){.options{grid-template-columns:1fr}.panel,.question{padding:17px}.hanzi{font-size:26px}} </style></head><body>
<header><h1>합격킹 HSK 화선쌤 속사포 0-3급 부사어</h1></header><main class="wrap"><section class="panel"><div class="top"><div><strong>HSK 0-3급 · 부사어</strong><p class="muted">한자를 누르면 중국어 발음이 나옵니다. 정답을 고르세요.</p></div><span class="tag" id="progress"></span></div><div id="result" aria-live="polite"></div></section><div id="questions"></div><div class="actions"><button class="action" id="grade">채점하기</button><button class="action secondary" id="previous">이전 결과 다시 보기</button><button class="action secondary" id="retry">틀린 문제 다시 풀기</button><button class="action secondary" id="restart">처음부터 다시 풀기</button></div></main>
<script>
const BANK=[{"h": "非常", "p": "fēicháng", "m": "매우, 아주", "kind": "adverb", "speech": "非常"}, {"h": "特别", "p": "tèbié", "m": "특히, 유달리", "kind": "adverb", "speech": "特别"}, {"h": "真", "p": "zhēn", "m": "정말, 진짜", "kind": "adverb", "speech": "真"}, {"h": "最", "p": "zuì", "m": "가장, 제일", "kind": "adverb", "speech": "最"}, {"h": "挺…的", "p": "tǐng~de", "m": "꽤, 상당히", "kind": "adverb", "speech": "挺好的"}, {"h": "比较", "p": "bǐjiào", "m": "비교적", "kind": "adverb", "speech": "比较"}, {"h": "经常", "p": "jīngcháng", "m": "자주", "kind": "adverb", "speech": "经常"}, {"h": "总是", "p": "zǒngshì", "m": "늘, 항상, 언제나", "kind": "adverb", "speech": "总是"}, {"h": "一直", "p": "yìzhí", "m": "줄곧, 내내, 계속", "kind": "adverb", "speech": "一直"}, {"h": "已经", "p": "yǐjīng", "m": "이미, 벌써", "kind": "adverb", "speech": "已经"}, {"h": "马上", "p": "mǎshàng", "m": "곧, 즉시", "kind": "adverb", "speech": "马上"}, {"h": "就", "p": "jiù", "m": "곧, 바로 (이르거나 짧음)", "kind": "adverb", "speech": "就"}, {"h": "才", "p": "cái", "m": "이제야, 비로소 (늦거나 긺)", "kind": "adverb", "speech": "才"}, {"h": "还(是)", "p": "hái(shì)", "m": "아직, 여전히 / 아무래도, 역시", "kind": "adverb", "speech": "还是，还"}, {"h": "敢", "p": "gǎn", "m": "감히, 용기 있게, 대담하게", "kind": "adverb", "speech": "敢"}, {"h": "其实", "p": "qíshí", "m": "사실은", "kind": "adverb", "speech": "其实"}, {"h": "几乎", "p": "jīhū", "m": "거의", "kind": "adverb", "speech": "几乎"}, {"h": "可能", "p": "kěnéng", "m": "아마, 어쩌면", "kind": "adverb", "speech": "可能"}, {"h": "当然", "p": "dāngrán", "m": "당연히, 물론", "kind": "adverb", "speech": "当然"}, {"h": "主要", "p": "zhǔyào", "m": "주요하게, 주로", "kind": "adverb", "speech": "主要"}, {"h": "一定", "p": "yídìng", "m": "반드시, 꼭", "kind": "adverb", "speech": "一定"}, {"h": "更", "p": "gèng", "m": "더욱, 더", "kind": "adverb", "speech": "更"}, {"h": "一共", "p": "yígòng", "m": "모두 합쳐서, 총", "kind": "adverb", "speech": "一共"}, {"h": "只", "p": "zhǐ", "m": "오직, 단지, ~만", "kind": "adverb", "speech": "只"}, {"h": "突然", "p": "tūrán", "m": "갑자기", "kind": "adverb", "speech": "突然"}, {"h": "一般", "p": "yìbān", "m": "일반적으로, 보통", "kind": "adverb", "speech": "一般"}, {"h": "终于", "p": "zhōngyú", "m": "마침내, 결국", "kind": "adverb", "speech": "终于"}, {"h": "必须", "p": "bìxū", "m": "반드시 ~해야 한다", "kind": "adverb", "speech": "必须"}, {"h": "好像", "p": "hǎoxiàng", "m": "마치 ~인 것 같다, 듯하다", "kind": "adverb", "speech": "好像"}, {"h": "自己", "p": "zìjǐ", "m": "스스로", "kind": "adverb", "speech": "自己"}, {"h": "又", "p": "yòu", "m": "또, 다시 (이미 일어난 일의 반복)", "kind": "adverb", "speech": "又"}, {"h": "再", "p": "zài", "m": "또, 다시 (앞으로 일어날 일의 반복)", "kind": "adverb", "speech": "再"}, {"h": "多(么)", "p": "duō(me)", "m": "얼마나 ~한가 (감탄)", "kind": "adverb", "speech": "多么，多"}, {"h": "…极了", "p": "~jí le", "m": "매우 ~하다, 극히 ~하다", "kind": "adverb", "speech": "好极了"}, {"h": "…死了", "p": "~sǐ le", "m": "~해 죽겠다", "kind": "adverb", "speech": "累死了"}, {"h": "正在…呢", "p": "zhèngzài~ne", "m": "~하는 중이다", "kind": "adverb", "speech": "正在学习呢"}, {"h": "有点(儿)…", "p": "yǒudiǎn(r)", "m": "조금, 약간 (부정적인 어감)", "kind": "adverb", "speech": "有点儿，有点"}, {"h": "…一点(儿)", "p": "~ yìdiǎn(r)", "m": "조금, 약간 (양적으로 적음)", "kind": "adverb", "speech": "一点儿，一点"}, {"h": "别…(了)", "p": "bié~(le)", "m": "~하지 마라 (권유, 제안)", "kind": "adverb", "speech": "别走了，别走"}, {"h": "不要…(了)", "p": "búyào~(le)", "m": "~하지 마라 (명령)", "kind": "adverb", "speech": "不要走了，不要走"}, {"h": "想", "p": "xiǎng", "m": "~하고 싶다", "kind": "modal", "speech": "想"}, {"h": "要", "p": "yào", "m": "~해야 한다 [의무] / ~할 것이다 [의지]", "kind": "modal", "speech": "要"}, {"h": "得", "p": "děi", "m": "~해야 한다 (要보다 의무감 강함)", "kind": "modal", "speech": "得"}, {"h": "应该", "p": "yīnggāi", "m": "마땅히 ~해야 한다 [의무] / 분명히 ~할 것이다 [추측]", "kind": "modal", "speech": "应该"}, {"h": "会", "p": "huì", "m": "~할 것이다 [추측] / ~할 수 있다 [학습] / ~하곤 한다 [습관]", "kind": "modal", "speech": "会"}, {"h": "能", "p": "néng", "m": "~할 수 있다 [선천적 능력, 상황]", "kind": "modal", "speech": "能"}, {"h": "可以", "p": "kěyǐ", "m": "~할 수 있다 [상황] / ~해도 된다 [허가]", "kind": "modal", "speech": "可以"}, {"h": "在", "p": "zài", "m": "~에서", "kind": "prep", "speech": "在"}, {"h": "和", "p": "hé", "m": "~와, 그리고", "kind": "prep", "speech": "和"}, {"h": "跟", "p": "gēn", "m": "~와, ~에게", "kind": "prep", "speech": "跟"}, {"h": "给", "p": "gěi", "m": "~에게", "kind": "prep", "speech": "给"}, {"h": "对", "p": "duì", "m": "~에 대하여, ~에게", "kind": "prep", "speech": "对"}, {"h": "向", "p": "xiàng", "m": "~를 향해, ~에게 (방향/대상)", "kind": "prep", "speech": "向"}, {"h": "往", "p": "wǎng", "m": "~를 향해, ~쪽으로 (주로 방향)", "kind": "prep", "speech": "往"}, {"h": "为(了)", "p": "wèi(le)", "m": "~를 위하여, ~ 때문에", "kind": "prep", "speech": "为了，为"}, {"h": "关于", "p": "guānyú", "m": "~에 관하여", "kind": "prep", "speech": "关于"}, {"h": "根据", "p": "gēnjù", "m": "~에 근거하여, ~에 따라", "kind": "prep", "speech": "根据"}, {"h": "从", "p": "cóng", "m": "~부터", "kind": "prep", "speech": "从"}, {"h": "离", "p": "lí", "m": "~로부터", "kind": "prep", "speech": "离"}, {"h": "把", "p": "bǎ", "m": "~을/를", "kind": "prep", "speech": "把"}, {"h": "被", "p": "bèi", "m": "~에게 ~당하다", "kind": "prep", "speech": "被"}, {"h": "比", "p": "bǐ", "m": "~보다", "kind": "prep", "speech": "比"}];
const KEY="hsk03_quiz_07_result_v1";
const $=id=>document.getElementById(id);
const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
let active=[],answers={},graded=false;
function speak(item){if(!("speechSynthesis" in window)){alert("이 브라우저는 음성 재생을 지원하지 않습니다.");return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(item.speech);u.lang="zh-CN";u.rate=.82;let voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang.toLowerCase().startsWith("zh-cn"))||voices.find(v=>v.lang.toLowerCase().startsWith("zh"))||null;speechSynthesis.speak(u)}
function init(ids){active=shuffle(ids.map(i=>({id:i,opts:makeOptions(i)})));answers={};graded=false;$("result").innerHTML="";render()}
function makeOptions(id){let q=BANK[id],pool=shuffle([...new Set(BANK.filter(x=>x.kind===q.kind&&x.m!==q.m).map(x=>x.m))]);return shuffle([q.m,...pool.slice(0,3)])}
function render(){let root=$("questions");root.innerHTML="";$("progress").textContent=active.length+"문제 · 선택 "+Object.keys(answers).length+"개";
active.forEach(({id,opts},idx)=>{let q=BANK[id],section=document.createElement("section");section.className="question";let h=document.createElement("h3");h.textContent=(idx+1)+". "+(q.kind==="adverb"?"부사":q.kind==="modal"?"조동사":"개사");section.append(h);
let word=document.createElement("button");word.className="hanzi";word.textContent=q.h;word.title="발음 듣기";word.onclick=()=>speak(q);section.append(word);let hint=document.createElement("div");hint.className="hint";hint.textContent="🔊 한자를 눌러 발음 듣기";section.append(hint);
let options=document.createElement("div");options.className="options";opts.forEach((m,j)=>{let b=document.createElement("button");b.className="option";b.textContent=(j+1)+". "+m;if(answers[id]===m)b.classList.add("selected");if(graded){b.disabled=true;if(m===q.m)b.classList.add("correct");if(answers[id]===m&&m!==q.m)b.classList.add("wrong")}b.onclick=()=>{if(graded)return;answers[id]=m;render()};options.append(b)});section.append(options);
if(graded&&answers[id]!==q.m){let a=document.createElement("div");a.className="answer";a.textContent="정답: "+q.m+"  |  병음: "+q.p;section.append(a)}root.append(section)})}
function grade(){if(graded)return;let missing=active.length-Object.keys(answers).length;if(missing&&!confirm(missing+"문제를 선택하지 않았습니다. 채점할까요?"))return;graded=true;let correct=active.filter(x=>answers[x.id]===BANK[x.id].m).length;let wrong=active.filter(x=>answers[x.id]!==BANK[x.id].m).map(x=>x.id);let snapshot={active,answers,correct,wrong,date:new Date().toLocaleString("ko-KR")};localStorage.setItem(KEY,JSON.stringify(snapshot));$("result").innerHTML='<p class="score">'+correct+' / '+active.length+' 정답 ('+Math.round(correct/active.length*100)+'점)</p><p class="muted">오답 '+wrong.length+'개 · 오답 아래에 병음과 뜻이 표시됩니다.</p>';render()}
$("grade").onclick=grade;
$("restart").onclick=()=>{if(confirm("전체 문제를 새 순서로 시작할까요?"))init(BANK.map((_,i)=>i))};
$("previous").onclick=()=>{let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch{}if(!s||!Array.isArray(s.active)){alert("저장된 이전 결과가 없습니다.");return}active=s.active;answers=s.answers;graded=true;$("result").innerHTML='<p class="score">이전 결과: '+s.correct+' / '+active.length+' 정답</p><p class="muted">'+s.date+'</p>';render();scrollTo({top:0,behavior:"smooth"})};
$("retry").onclick=()=>{let wrong=active.filter(x=>answers[x.id]!==BANK[x.id].m).map(x=>x.id);if(!graded){let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch{}wrong=s?.wrong||[]}if(!wrong.length){alert("다시 풀 오답이 없습니다. 먼저 채점해 주세요.");return}init(wrong);scrollTo({top:0,behavior:"smooth"})};
init(BANK.map((_,i)=>i));
</script></body></html>
